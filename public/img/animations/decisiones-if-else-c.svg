  <path d="M40 150l150-76 150 76-150 76z" fill="#faf5ec" stroke="#7d9a76" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M90 140l70-36 50 26 70 36" stroke="#7d9a76"/>
    <path d="M160 104l40-20 70 36 10 46" stroke="#2e2b25" stroke-opacity="0.25"/>
  </g>
  <g stroke-linejoin="round" stroke-width="2.5">
    <path d="M144 104l16-8 16 8-16 8z" fill="#c0714a" stroke="#c0714a"/>
