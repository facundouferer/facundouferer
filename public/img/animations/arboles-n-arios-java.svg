<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="El viaje por un árbol N-ario: primer hijo, siguiente hermano y vector de padres">
  <rect width="400" height="200" fill="#f1e8d9"/>
  <rect x="24" y="22" width="352" height="156" rx="22" fill="#2e2b25"/>
  <circle cx="48" cy="44" r="6" fill="#c0714a"/><circle cx="66" cy="44" r="6" fill="#e8a27c"/><circle cx="84" cy="44" r="6" fill="#7d9a76"/>
  <!-- First-child links (down) and next-sibling links (across): A{B{E}, C, D} -->
  <path d="M66 92v20M66 140v12" fill="none" stroke="#e8a27c" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M88 128h20M150 128h20" fill="none" stroke="#7d9a76" stroke-width="3.5" stroke-linecap="round"/>
  <g stroke-width="3" fill="#faf5ec">
    <rect x="46" y="62" width="40" height="30" rx="10" stroke="#e8a27c"/>
    <rect x="46" y="112" width="40" height="30" rx="10" stroke="#7d9a76"/>
    <rect x="110" y="112" width="40" height="30" rx="10" stroke="#7d9a76"/>
    <rect x="172" y="112" width="40" height="30" rx="10" stroke="#7d9a76"/>
    <rect x="46" y="152" width="40" height="18" rx="8" stroke="#e8a27c"/>
  </g>
  <g font-family="monospace" font-size="14" font-weight="700" fill="#2e2b25" text-anchor="middle">
    <text x="66" y="82">A</text>
    <text x="66" y="132">B</text>
    <text x="130" y="132">C</text>
    <text x="192" y="132">D</text>
    <text x="66" y="166" font-size="12">E</text>
  </g>
  <!-- Parent-index vector on the right -->
  <rect x="236" y="70" width="124" height="80" rx="14" fill="#faf5ec" stroke="#c0714a" stroke-width="3"/>
  <g font-family="monospace" font-size="11" font-weight="700" fill="#2e2b25" text-anchor="middle">
    <text x="298" y="92">padres[]</text>
    <text x="298" y="114">{-1, 0, 0, 0, 1}</text>
    <text x="298" y="136">  A  B  C  D  E</text>
  </g>
  <g font-family="sans-serif" font-size="11" font-weight="700" fill="#faf5ec">
    <text x="100" y="80">primerHijo / siguienteHermano</text>
  </g>
</svg>
