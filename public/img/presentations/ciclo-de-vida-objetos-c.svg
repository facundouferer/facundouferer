<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>
	<text x="24" y="34" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#8c491a">free(datos);</text>
	<!-- Stack: two pointers to the same block -->
	<g transform="translate(24, 56)">
		<rect width="104" height="40" rx="12" fill="#f5ead8"/>
		<text x="14" y="25" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#201e1d">datos</text>
		<circle cx="86" cy="20" r="5" fill="#c67139"/>
		<rect y="56" width="104" height="40" rx="12" fill="#f5ead8"/>
		<text x="14" y="81" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#201e1d">alias</text>
		<circle cx="86" cy="76" r="5" fill="#c67139"/>
	</g>
	<!-- Dangling arrows -->
	<path d="M 115 76 C 170 76, 190 92, 236 92" fill="none" stroke="#c67139" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7"/>
	<path d="M 115 132 C 170 132, 190 108, 236 108" fill="none" stroke="#c67139" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 7"/>
	<path d="M 228 86 L 238 92 L 228 98" fill="none" stroke="#c67139" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
	<path d="M 228 102 L 238 108 L 228 114" fill="none" stroke="#c67139" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
	<!-- Freed heap block -->
	<g transform="translate(244, 60)">
		<rect width="132" height="80" rx="16" fill="#f5ead8" fill-opacity="0.6" stroke="#82796a" stroke-width="2.5" stroke-dasharray="7 6"/>
		<text x="16" y="30" font-family="'Fira Code', monospace" font-size="13" font-weight="700" fill="#82796a">0x1000</text>
		<text x="16" y="56" font-family="'Caprasimo', serif" font-size="17" fill="#82796a">liberado</text>
	</g>
	<!-- Lifetime bar: live then freed -->
	<g transform="translate(24, 168)">
		<rect width="200" height="10" rx="5" fill="#7a8a5e"/>
		<rect x="208" width="144" height="10" rx="5" fill="#c67139" fill-opacity="0.35"/>
		<circle cx="204" cy="5" r="8" fill="#c67139"/>
	</g>
</svg>
