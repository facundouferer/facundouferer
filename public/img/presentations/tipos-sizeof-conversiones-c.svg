<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>
	<text x="24" y="34" font-family="'Caprasimo', serif" font-size="20" fill="#201e1d">sizeof</text>
	<text x="104" y="34" font-family="monospace" font-size="12" font-weight="700" fill="#8c491a">size_t · %zu</text>
	<!-- char: 1 byte -->
	<g transform="translate(24, 50)">
		<text x="0" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#56633f">char</text>
		<rect x="74" y="0" width="26" height="18" rx="6" fill="#e1eecc" stroke="#8fa073" stroke-width="1.5"/>
		<text x="352" y="13" font-family="monospace" font-size="11" fill="#645c50" text-anchor="end">1</text>
	</g>
	<!-- int: 4 bytes -->
	<g transform="translate(24, 76)">
		<text x="0" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#56633f">int</text>
		<rect x="74" y="0" width="26" height="18" rx="6" fill="#e1eecc" stroke="#8fa073" stroke-width="1.5"/>
		<rect x="103" y="0" width="26" height="18" rx="6" fill="#e1eecc" stroke="#8fa073" stroke-width="1.5"/>
		<rect x="132" y="0" width="26" height="18" rx="6" fill="#e1eecc" stroke="#8fa073" stroke-width="1.5"/>
		<rect x="161" y="0" width="26" height="18" rx="6" fill="#e1eecc" stroke="#8fa073" stroke-width="1.5"/>
		<text x="352" y="13" font-family="monospace" font-size="11" fill="#645c50" text-anchor="end">4</text>
	</g>
	<!-- double: 8 bytes -->
	<g transform="translate(24, 102)">
		<text x="0" y="12" font-family="monospace" font-size="11" font-weight="700" fill="#56633f">double</text>
		<rect x="74" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="103" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="132" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="161" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="190" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="219" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="248" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<rect x="277" y="0" width="26" height="18" rx="6" fill="#ffe1d0" stroke="#c67139" stroke-width="1.5"/>
		<text x="352" y="13" font-family="monospace" font-size="11" fill="#645c50" text-anchor="end">8</text>
	</g>
	<!-- conversions -->
	<g transform="translate(24, 140)">
		<rect x="0" y="0" width="166" height="40" rx="14" fill="#f5ead8" stroke="#c67139" stroke-width="1.5"/>
		<text x="83" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#8c491a" text-anchor="middle">-1 &lt; 1u → 0</text>
		<rect x="186" y="0" width="166" height="40" rx="14" fill="#f5ead8" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="269" y="25" font-family="monospace" font-size="13" font-weight="700" fill="#56633f" text-anchor="middle">(double)17 / 4</text>
	</g>
</svg>
