<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Title -->
	<text x="24" y="26" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a">Stack y heap en C</text>
	<text x="24" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e">Duración automática, estática y asignada</text>

	<!-- Static region -->
	<g transform="translate(24, 52)">
		<rect x="0" y="0" width="104" height="124" rx="14" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.8"/>
		<text x="10" y="18" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#56633f">Estática</text>
		<rect x="8" y="28" width="88" height="24" rx="7" fill="#f0fae1" stroke="#7a8a5e" stroke-width="1.2"/>
		<text x="14" y="43" font-family="monospace" font-size="7" font-weight="700" fill="#56633f">turno = 3</text>
		<rect x="8" y="58" width="88" height="24" rx="7" fill="#f0fae1" stroke="#7a8a5e" stroke-width="1.2"/>
		<text x="14" y="73" font-family="monospace" font-size="7" font-weight="700" fill="#56633f">llamadas = 3</text>
		<text x="10" y="108" font-family="'Figtree', sans-serif" font-size="6.5" fill="#8c8275">vive todo el programa</text>
	</g>

	<!-- Stack region -->
	<g transform="translate(148, 52)">
		<rect x="0" y="0" width="104" height="124" rx="14" fill="#fdfbf7" stroke="#c63f17" stroke-width="1.8"/>
		<text x="10" y="18" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#c63f17">Pila</text>
		<rect x="8" y="28" width="88" height="26" rx="7" fill="#fdfbf7" stroke="#f6a06b" stroke-width="1.2" stroke-dasharray="3 2"/>
		<text x="14" y="44" font-family="monospace" font-size="7" fill="#a89d8f">f(4): desapilado</text>
		<rect x="8" y="60" width="88" height="26" rx="7" fill="#ffe1d0" stroke="#f6a06b" stroke-width="1.2"/>
		<text x="14" y="76" font-family="monospace" font-size="7" font-weight="700" fill="#c63f17">f(5): n, cuadrado</text>
		<rect x="8" y="92" width="88" height="24" rx="7" fill="#ffe1d0" stroke="#f6a06b" stroke-width="1.2"/>
		<text x="14" y="107" font-family="monospace" font-size="7" font-weight="700" fill="#c63f17">main: p</text>
	</g>

	<!-- Heap region -->
	<g transform="translate(272, 52)">
		<rect x="0" y="0" width="104" height="124" rx="14" fill="#fdfbf7" stroke="#dcd3c4" stroke-width="1.8"/>
		<text x="10" y="18" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#5c5346">Montículo</text>
		<rect x="8" y="28" width="40" height="24" rx="7" fill="#f0fae1" stroke="#7a8a5e" stroke-width="1.2"/>
		<rect x="54" y="28" width="42" height="24" rx="7" fill="#e8decb"/>
		<rect x="8" y="58" width="88" height="24" rx="7" fill="#f0fae1" stroke="#7a8a5e" stroke-width="1.2"/>
		<text x="10" y="102" font-family="'Figtree', sans-serif" font-size="6.5" fill="#8c8275">bloques pedidos y</text>
		<text x="10" y="112" font-family="'Figtree', sans-serif" font-size="6.5" fill="#8c8275">devueltos a pedido</text>
	</g>

	<!-- Dangling pointer hint -->
	<text x="148" y="192" font-family="'Figtree', sans-serif" font-size="7" fill="#c63f17">Un puntero no alarga la vida de nadie</text>
</svg>
