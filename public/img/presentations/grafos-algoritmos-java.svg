<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="26" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">Grafos: Representación &amp; Algoritmos</text>
	<text x="200" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">Matriz, Lista, BFS, DFS, Dijkstra &amp; Floyd-Warshall</text>

	<!-- Graph visual centered -->
	<g transform="translate(200, 105)">
		<!-- Edges with weights -->
		<!-- A(0, -45) to B(-80, -10) -->
		<line x1="0" y1="-45" x2="-80" y2="-10" stroke="#7a8a5e" stroke-width="2.5"/>
		<rect x="-48" y="-36" width="18" height="14" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1"/>
		<text x="-39" y="-26" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">4</text>

		<!-- A(0, -45) to C(80, -10) -->
		<line x1="0" y1="-45" x2="80" y2="-10" stroke="#c67139" stroke-width="2.5"/>
		<rect x="30" y="-36" width="18" height="14" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="1"/>
		<text x="39" y="-26" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">2</text>

		<!-- B(-80, -10) to D(-50, 40) -->
		<line x1="-80" y1="-10" x2="-50" y2="40" stroke="#7a8a5e" stroke-width="2"/>
		<rect x="-74" y="10" width="18" height="14" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1"/>
		<text x="-65" y="20" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">5</text>

		<!-- C(80, -10) to E(50, 40) -->
		<line x1="80" y1="-10" x2="50" y2="40" stroke="#c67139" stroke-width="2.5"/>
		<rect x="56" y="10" width="18" height="14" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="1"/>
		<text x="65" y="20" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">1</text>

		<!-- B(-80, -10) to C(80, -10) -->
		<line x1="-80" y1="-10" x2="80" y2="-10" stroke="#dcd3c4" stroke-width="1.5" stroke-dasharray="4,4"/>

		<!-- D(-50, 40) to E(50, 40) -->
		<line x1="-50" y1="40" x2="50" y2="40" stroke="#8c491a" stroke-width="2.5"/>
		<rect x="-9" y="33" width="18" height="14" rx="4" fill="#fdfbf7" stroke="#8c491a" stroke-width="1"/>
		<text x="0" y="43" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">3</text>

		<!-- Nodes -->
		<!-- Node A -->
		<circle cx="0" cy="-45" r="18" fill="#fdfbf7" stroke="#8c491a" stroke-width="2.5"/>
		<text x="0" y="-40" font-family="'Figtree', sans-serif" font-weight="700" font-size="11" fill="#8c491a" text-anchor="middle">A</text>

		<!-- Node B -->
		<circle cx="-80" cy="-10" r="16" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<text x="-80" y="-5" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#2c2a29" text-anchor="middle">B</text>

		<!-- Node C -->
		<circle cx="80" cy="-10" r="16" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<text x="80" y="-5" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#8c491a" text-anchor="middle">C</text>

		<!-- Node D -->
		<circle cx="-50" cy="40" r="15" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<text x="-50" y="44" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#2c2a29" text-anchor="middle">D</text>

		<!-- Node E -->
		<circle cx="50" cy="40" r="15" fill="#fdfbf7" stroke="#8c491a" stroke-width="2.5"/>
		<text x="50" y="44" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#8c491a" text-anchor="middle">E</text>
	</g>

	<!-- Indicators -->
	<text x="70" y="155" font-family="'Caprasimo', serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">BFS (Cola) / DFS (Pila)</text>
	<text x="330" y="155" font-family="'Caprasimo', serif" font-size="8.5" fill="#8c491a" text-anchor="middle">Dijkstra Min-Path</text>
</svg>
