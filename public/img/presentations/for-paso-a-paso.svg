<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>
	<g transform="translate(40, 50)">
		<rect width="320" height="100" rx="16" fill="#f5ead8" stroke="#8c491a" stroke-width="3"/>
		<text x="160" y="35" font-family="'Fira Code', monospace" font-size="14" font-weight="700" fill="#201e1d" text-anchor="middle">for (i=0; i&lt;5; i++)</text>
		<!-- Step Counter Pills -->
		<g transform="translate(30, 55)">
			<rect width="40" height="25" rx="6" fill="#c67139"/>
			<text x="20" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">i=0</text>
			<rect x="50" width="40" height="25" rx="6" fill="#c67139"/>
			<text x="70" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">i=1</text>
			<rect x="100" width="40" height="25" rx="6" fill="#c67139"/>
			<text x="120" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">i=2</text>
			<rect x="150" width="40" height="25" rx="6" fill="#c67139"/>
			<text x="170" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">i=3</text>
			<rect x="200" width="40" height="25" rx="6" fill="#c67139"/>
			<text x="220" y="17" font-family="'Fira Code', monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">i=4</text>
		</g>
	</g>
</svg>