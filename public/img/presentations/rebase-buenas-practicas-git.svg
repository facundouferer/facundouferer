<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="24" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">Git Rebase &amp; Buenas Prácticas</text>
	<text x="200" y="38" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">Replay lineal, Regla de Oro &amp; Conventional Commits</text>

	<!-- Linear Rebased History -->
	<g transform="translate(24, 48)">
		<rect x="0" y="0" width="220" height="106" rx="12" fill="#fdfbf7" stroke="#dcd3c4" stroke-width="1.8"/>
		
		<text x="12" y="22" font-family="'Figtree', sans-serif" font-weight="700" font-size="7" fill="#5c5346">Historial lineal resultante (git rebase main)</text>
		
		<!-- Rebased Linear Line -->
		<path d="M 20,55 L 200,55" stroke="#c63f17" stroke-width="2.5"/>
		
		<!-- Commits on linear track -->
		<!-- A -->
		<circle cx="30" cy="55" r="7" fill="#c63f17"/>
		<text x="30" y="57.5" font-family="monospace" font-size="5.5" fill="#fdfbf7" font-weight="700" text-anchor="middle">A</text>
		
		<!-- B -->
		<circle cx="70" cy="55" r="7" fill="#c63f17"/>
		<text x="70" y="57.5" font-family="monospace" font-size="5.5" fill="#fdfbf7" font-weight="700" text-anchor="middle">B</text>
		
		<!-- C (main tip) -->
		<circle cx="110" cy="55" r="7" fill="#c63f17"/>
		<text x="110" y="57.5" font-family="monospace" font-size="5.5" fill="#fdfbf7" font-weight="700" text-anchor="middle">C</text>
		
		<!-- D' (rebased) -->
		<circle cx="150" cy="55" r="7.5" fill="#7a8a5e" stroke="#56633f" stroke-width="1.2"/>
		<text x="150" y="57.5" font-family="monospace" font-size="5" fill="#fdfbf7" font-weight="700" text-anchor="middle">D'</text>
		
		<!-- E' (rebased tip) -->
		<circle cx="185" cy="55" r="7.5" fill="#7a8a5e" stroke="#56633f" stroke-width="1.2"/>
		<text x="185" y="57.5" font-family="monospace" font-size="5" fill="#fdfbf7" font-weight="700" text-anchor="middle">E'</text>

		<text x="110" y="74" font-family="monospace" font-size="6" fill="#c63f17" text-anchor="middle">main</text>
		<text x="185" y="74" font-family="monospace" font-size="6" font-weight="700" fill="#56633f" text-anchor="middle">HEAD › feature</text>
		
		<rect x="20" y="82" width="180" height="16" rx="4" fill="#f0fae1"/>
		<text x="110" y="93" font-family="'Figtree', sans-serif" font-size="6" fill="#56633f" text-anchor="middle">✓ Sin merge commits redundantes · Grafo limpio</text>
	</g>

	<!-- Best Practices Checklist Box -->
	<g transform="translate(254, 48)">
		<rect x="0" y="0" width="122" height="106" rx="12" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.8"/>
		<rect x="6" y="6" width="110" height="18" rx="5" fill="#f0fae1"/>
		<text x="61" y="18" font-family="'Figtree', sans-serif" font-weight="700" font-size="6.8" fill="#56633f" text-anchor="middle">📋 Buenas Prácticas</text>
		
		<g transform="translate(10, 32)">
			<text x="0" y="8" font-family="monospace" font-size="5.2" fill="#8c491a" font-weight="700">feat(auth): add login</text>
			<text x="0" y="18" font-family="'Figtree', sans-serif" font-size="5" fill="#5c5346">✓ Commits atómicos</text>
			<text x="0" y="30" font-family="monospace" font-size="5.2" fill="#8c491a" font-weight="700">.gitignore</text>
			<text x="0" y="40" font-family="'Figtree', sans-serif" font-size="5" fill="#5c5346">✓ Sin secretos ni dist</text>
			<text x="0" y="52" font-family="monospace" font-size="5.2" fill="#c63f17" font-weight="700">Regla de Oro</text>
			<text x="0" y="62" font-family="'Figtree', sans-serif" font-size="5" fill="#c63f17">✕ No rebase en público</text>
		</g>
	</g>

	<!-- Caption -->
	<text x="200" y="193" font-family="'Figtree', sans-serif" font-size="7" fill="#645c50" text-anchor="middle">Replantear la base mantiene un árbol bisectable y libre de ruido en proyectos serios</text>
</svg>
