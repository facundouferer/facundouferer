<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="25" y="170" width="350" height="10" rx="5" fill="#dcd3c4"/>

	<!-- Title Banner -->
	<text x="200" y="28" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a" text-anchor="middle">Herencia y Polimorfismo</text>
	<text x="200" y="42" font-family="'Figtree', sans-serif" font-size="9" fill="#7a8a5e" text-anchor="middle">Despacho Dinámico, super() y vtable</text>

	<!-- Superclass Box (Vehiculo) -->
	<g transform="translate(145, 52)">
		<rect x="0" y="0" width="110" height="42" rx="6" fill="#fdfbf7" stroke="#8c491a" stroke-width="2"/>
		<text x="55" y="16" font-family="'Caprasimo', serif" font-size="8" fill="#8c491a" text-anchor="middle">Vehiculo</text>
		<line x1="8" y1="22" x2="102" y2="22" stroke="#dcd3c4" stroke-width="1"/>
		<text x="55" y="34" font-family="'Fira Code', monospace" font-size="7" fill="#7a8a5e" text-anchor="middle">arrancar()</text>
	</g>

	<!-- UML Triangle Arrow pointing up to superclass -->
	<path d="M200 95 L200 110" stroke="#8c491a" stroke-width="1.5"/>
	<polygon points="200,94 195,102 205,102" fill="#fdfbf7" stroke="#8c491a" stroke-width="1.5"/>

	<!-- Horizontal connector bar -->
	<line x1="95" y1="110" x2="305" y2="110" stroke="#8c491a" stroke-width="1.5"/>
	<line x1="95" y1="110" x2="95" y2="120" stroke="#8c491a" stroke-width="1.5"/>
	<line x1="305" y1="110" x2="305" y2="120" stroke="#8c491a" stroke-width="1.5"/>

	<!-- Subclass 1: Auto -->
	<g transform="translate(45, 120)">
		<rect x="0" y="0" width="100" height="42" rx="6" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="50" y="15" font-family="'Caprasimo', serif" font-size="8" fill="#c67139" text-anchor="middle">Auto</text>
		<line x1="8" y1="21" x2="92" y2="21" stroke="#dcd3c4" stroke-width="1"/>
		<text x="50" y="33" font-family="'Fira Code', monospace" font-size="6.5" fill="#201e1d" text-anchor="middle">@Override arrancar()</text>
	</g>

	<!-- Subclass 2: Moto -->
	<g transform="translate(255, 120)">
		<rect x="0" y="0" width="100" height="42" rx="6" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="50" y="15" font-family="'Caprasimo', serif" font-size="8" fill="#7a8a5e" text-anchor="middle">Moto</text>
		<line x1="8" y1="21" x2="92" y2="21" stroke="#dcd3c4" stroke-width="1"/>
		<text x="50" y="33" font-family="'Fira Code', monospace" font-size="6.5" fill="#201e1d" text-anchor="middle">@Override arrancar()</text>
	</g>
</svg>
