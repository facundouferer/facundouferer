<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="26" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">Java Collections Framework</text>
	<text x="200" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">Jerarquía, Genéricos &amp; HashMap Internals</text>

	<!-- Left: JCF Tree -->
	<g transform="translate(30, 50)">
		<!-- Root: Collection -->
		<rect x="35" y="0" width="70" height="22" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="70" y="14" font-family="'Caprasimo', serif" font-size="8" fill="#7a8a5e" text-anchor="middle">Collection&lt;E&gt;</text>

		<!-- Branch lines -->
		<path d="M 50 22 L 20 40 M 70 22 L 70 40 M 90 22 L 120 40" stroke="#7a8a5e" stroke-width="1.5" fill="none"/>

		<!-- List -->
		<rect x="0" y="40" width="40" height="18" rx="3" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="20" y="52" font-family="'Figtree', sans-serif" font-weight="700" font-size="7.5" fill="#c67139" text-anchor="middle">List</text>

		<!-- Set -->
		<rect x="50" y="40" width="40" height="18" rx="3" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="70" y="52" font-family="'Figtree', sans-serif" font-weight="700" font-size="7.5" fill="#c67139" text-anchor="middle">Set</text>

		<!-- Queue -->
		<rect x="100" y="40" width="40" height="18" rx="3" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="120" y="52" font-family="'Figtree', sans-serif" font-weight="700" font-size="7.5" fill="#c67139" text-anchor="middle">Queue</text>

		<!-- Standalone Map -->
		<rect x="40" y="75" width="60" height="20" rx="4" fill="#fdfbf7" stroke="#8c491a" stroke-width="1.5"/>
		<text x="70" y="88" font-family="'Caprasimo', serif" font-size="8" fill="#8c491a" text-anchor="middle">Map&lt;K,V&gt;</text>
		<text x="70" y="105" font-family="'Figtree', sans-serif" font-size="7" fill="#8c491a" text-anchor="middle">(Jerarquía propia)</text>
	</g>

	<!-- Vertical Divider -->
	<line x1="190" y1="52" x2="190" y2="160" stroke="#dcd3c4" stroke-width="1.5" stroke-dasharray="3 3"/>

	<!-- Right: HashMap Buckets Array & Node Chaining -->
	<g transform="translate(210, 52)">
		<text x="80" y="10" font-family="'Caprasimo', serif" font-size="9" fill="#8c491a" text-anchor="middle">HashMap: Buckets table[ ]</text>

		<!-- Array Buckets -->
		<g transform="translate(10, 20)">
			<!-- Bucket 0 -->
			<rect x="0" y="0" width="36" height="18" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1"/>
			<text x="18" y="12" font-family="'Fira Code', monospace" font-size="7.5" fill="#7a8a5e" text-anchor="middle">[0]</text>
			<!-- Bucket 1 -->
			<rect x="0" y="18" width="36" height="18" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1"/>
			<text x="18" y="30" font-family="'Fira Code', monospace" font-size="7.5" fill="#7a8a5e" text-anchor="middle">[1]</text>
			<!-- Bucket 2 (collision chaining) -->
			<rect x="0" y="36" width="36" height="18" fill="#f2f5ea" stroke="#c67139" stroke-width="1.5"/>
			<text x="18" y="48" font-family="'Fira Code', monospace" font-weight="700" font-size="7.5" fill="#c67139" text-anchor="middle">[2]</text>
			<!-- Bucket 3 -->
			<rect x="0" y="54" width="36" height="18" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1"/>
			<text x="18" y="66" font-family="'Fira Code', monospace" font-size="7.5" fill="#7a8a5e" text-anchor="middle">[3]</text>

			<!-- Chained Node 1 from bucket 2 -->
			<path d="M 36 45 L 55 45" stroke="#c67139" stroke-width="1.5"/>
			<rect x="55" y="36" width="45" height="18" rx="3" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
			<text x="77" y="48" font-family="'Figtree', sans-serif" font-weight="700" font-size="7" fill="#8c491a" text-anchor="middle">"k1": 42</text>

			<!-- Chained Node 2 -->
			<path d="M 100 45 L 115 45" stroke="#c67139" stroke-width="1.5"/>
			<rect x="115" y="36" width="45" height="18" rx="3" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
			<text x="137" y="48" font-family="'Figtree', sans-serif" font-weight="700" font-size="7" fill="#8c491a" text-anchor="middle">"k2": 99</text>

			<!-- Arrow down to null -->
			<path d="M 160 45 L 170 45" stroke="#7a8a5e" stroke-width="1.5"/>
			<text x="175" y="48" font-family="'Fira Code', monospace" font-size="6.5" fill="#7a8a5e">null</text>
		</g>

		<text x="85" y="105" font-family="'Figtree', sans-serif" font-size="7.5" fill="#7a8a5e" text-anchor="middle">Colisión: Lista Enlazada / Red-Black Tree</text>
	</g>
</svg>
