<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="28" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a" text-anchor="middle">TAD Pila &amp; TAD Cola</text>
	<text x="200" y="44" font-family="'Figtree', sans-serif" font-size="9" fill="#7a8a5e" text-anchor="middle">Disciplinas LIFO vs FIFO &amp; Cola Circular</text>

	<!-- Left: Stack (Pila LIFO) -->
	<g transform="translate(45, 60)">
		<!-- Vertical container / tube -->
		<path d="M 10 0 L 10 95 L 75 95 L 75 0" fill="none" stroke="#8c491a" stroke-width="3" stroke-linecap="round"/>
		
		<!-- Stack items -->
		<rect x="15" y="70" width="55" height="20" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="42" y="84" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#2c2a29" text-anchor="middle">[ 10 ]</text>

		<rect x="15" y="45" width="55" height="20" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="42" y="59" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#2c2a29" text-anchor="middle">[ 20 ]</text>

		<rect x="15" y="20" width="55" height="20" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<text x="42" y="34" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#8c491a" text-anchor="middle">[ 30 ]</text>

		<!-- Tope pointer -->
		<path d="M 95 30 L 78 30" stroke="#c67139" stroke-width="2" marker-end="url(#arrow)"/>
		<text x="100" y="33" font-family="'Caprasimo', serif" font-size="8.5" fill="#c67139">tope</text>

		<!-- LIFO Label -->
		<text x="42" y="110" font-family="'Caprasimo', serif" font-size="9" fill="#8c491a" text-anchor="middle">Pila (LIFO)</text>
	</g>

	<!-- Divider -->
	<line x1="185" y1="65" x2="185" y2="160" stroke="#dcd3c4" stroke-width="1.5" stroke-dasharray="4 4"/>

	<!-- Right: Queue (Cola FIFO) -->
	<g transform="translate(205, 75)">
		<!-- Horizontal pipe -->
		<line x1="0" y1="12" x2="160" y2="12" stroke="#7a8a5e" stroke-width="2.5"/>
		<line x1="0" y1="52" x2="160" y2="52" stroke="#7a8a5e" stroke-width="2.5"/>

		<!-- Queue items inside pipe moving right -->
		<!-- Item 1 (Front/Head) -->
		<rect x="110" y="18" width="38" height="28" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<text x="129" y="36" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#8c491a" text-anchor="middle">A</text>

		<!-- Item 2 -->
		<rect x="65" y="18" width="38" height="28" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="84" y="36" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#2c2a29" text-anchor="middle">B</text>

		<!-- Item 3 (Tail) -->
		<rect x="20" y="18" width="38" height="28" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="39" y="36" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#2c2a29" text-anchor="middle">C</text>

		<!-- Pointers: Dequeue / Frente -->
		<path d="M 152 32 L 168 32" stroke="#c67139" stroke-width="2"/>
		<polygon points="168,32 163,28 163,36" fill="#c67139"/>
		<text x="129" y="8" font-family="'Caprasimo', serif" font-size="8" fill="#c67139" text-anchor="middle">frente</text>

		<!-- Pointers: Enqueue / Fin -->
		<path d="M -8 32 L 12 32" stroke="#7a8a5e" stroke-width="2"/>
		<polygon points="12,32 7,28 7,36" fill="#7a8a5e"/>
		<text x="39" y="8" font-family="'Caprasimo', serif" font-size="8" fill="#7a8a5e" text-anchor="middle">fin</text>

		<!-- FIFO Label -->
		<text x="80" y="75" font-family="'Caprasimo', serif" font-size="9" fill="#7a8a5e" text-anchor="middle">Cola (FIFO)</text>
	</g>
</svg>
