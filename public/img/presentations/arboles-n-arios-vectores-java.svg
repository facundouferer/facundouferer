<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="26" font-family="'Caprasimo', serif" font-size="12.5" fill="#8c491a" text-anchor="middle">Árboles N-arios y Vector de Padres</text>
	<text x="200" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">LCRS, Preorden &amp; padre[i] en Java</text>

	<!-- N-ary tree (left) -->
	<g transform="translate(30, 55)">
		<path d="M60,20 L20,55" stroke="#c0b6a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
		<path d="M60,20 L60,55" stroke="#c0b6a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
		<path d="M60,20 L100,55" stroke="#c0b6a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
		<path d="M20,75 L8,105" stroke="#c0b6a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>
		<path d="M20,75 L32,105" stroke="#c0b6a5" stroke-width="2.5" stroke-linecap="round" fill="none"/>

		<circle cx="60" cy="12" r="13" fill="#8c491a"/>
		<text x="60" y="16" font-family="'Figtree', sans-serif" font-weight="700" font-size="10" fill="#fdfbf7" text-anchor="middle">A</text>

		<circle cx="20" cy="65" r="12" fill="#fdfbf7" stroke="#c67139" stroke-width="2.5"/>
		<text x="20" y="69" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#c67139" text-anchor="middle">B</text>

		<circle cx="60" cy="65" r="12" fill="#fdfbf7" stroke="#c67139" stroke-width="2.5"/>
		<text x="60" y="69" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#c67139" text-anchor="middle">C</text>

		<circle cx="100" cy="65" r="12" fill="#fdfbf7" stroke="#c67139" stroke-width="2.5"/>
		<text x="100" y="69" font-family="'Figtree', sans-serif" font-weight="700" font-size="9" fill="#c67139" text-anchor="middle">D</text>

		<circle cx="8" cy="115" r="10" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<text x="8" y="118" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#7a8a5e" text-anchor="middle">E</text>

		<circle cx="32" cy="115" r="10" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<text x="32" y="118" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#7a8a5e" text-anchor="middle">F</text>
	</g>

	<!-- Arrow -->
	<g transform="translate(172, 100)">
		<path d="M0,0 L34,0" stroke="#8c491a" stroke-width="2.5" stroke-linecap="round"/>
		<path d="M26,-7 L34,0 L26,7" stroke="#8c491a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
	</g>
	<text x="189" y="88" font-family="'Figtree', sans-serif" font-weight="700" font-size="7" fill="#8c491a" text-anchor="middle">LCRS</text>

	<!-- Parent vector (right) -->
	<g transform="translate(230, 70)">
		<text x="0" y="-8" font-family="monospace" font-size="8" font-weight="700" fill="#2c2a29">padre[i]</text>
		<rect x="0" y="0" width="26" height="24" rx="4" fill="#fdfbf7" stroke="#8c491a" stroke-width="2"/>
		<text x="13" y="16" font-family="monospace" font-size="9" fill="#8c491a" text-anchor="middle">-1</text>
		<rect x="27" y="0" width="26" height="24" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="40" y="16" font-family="monospace" font-size="9" fill="#c67139" text-anchor="middle">0</text>
		<rect x="54" y="0" width="26" height="24" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="67" y="16" font-family="monospace" font-size="9" fill="#c67139" text-anchor="middle">0</text>
		<rect x="81" y="0" width="26" height="24" rx="4" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="94" y="16" font-family="monospace" font-size="9" fill="#c67139" text-anchor="middle">0</text>
		<rect x="108" y="0" width="26" height="24" rx="4" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="121" y="16" font-family="monospace" font-size="9" fill="#7a8a5e" text-anchor="middle">1</text>
		<text x="0" y="40" font-family="monospace" font-size="7" fill="#a19786">0</text>
		<text x="27" y="40" font-family="monospace" font-size="7" fill="#a19786">1</text>
		<text x="54" y="40" font-family="monospace" font-size="7" fill="#a19786">2</text>
		<text x="81" y="40" font-family="monospace" font-size="7" fill="#a19786">3</text>
		<text x="108" y="40" font-family="monospace" font-size="7" fill="#a19786">4</text>
	</g>

	<!-- Labels below -->
	<text x="70" y="155" font-family="'Caprasimo', serif" font-size="8" fill="#c67139" text-anchor="middle">Primer Hijo / Hermano</text>
	<text x="280" y="155" font-family="'Caprasimo', serif" font-size="8" fill="#8c491a" text-anchor="middle">Vector de Padres O(1)</text>
</svg>
