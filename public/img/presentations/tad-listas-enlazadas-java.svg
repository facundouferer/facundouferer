<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="25" y="170" width="350" height="10" rx="5" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="28" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a" text-anchor="middle">TAD Listas</text>
	<text x="200" y="42" font-family="'Figtree', sans-serif" font-size="9" fill="#7a8a5e" text-anchor="middle">Estáticas vs Enlazadas en Memoria</text>

	<!-- cabeza pointer -->
	<g transform="translate(30, 80)">
		<rect x="0" y="0" width="55" height="40" rx="6" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="27" y="18" font-family="'Caprasimo', serif" font-size="7.5" fill="#7a8a5e" text-anchor="middle">cabeza</text>
		<text x="27" y="32" font-family="'Fira Code', monospace" font-size="7" fill="#8c491a" text-anchor="middle">0x3A20</text>
	</g>

	<!-- Arrow to Node 1 -->
	<path d="M85 100 L105 100" stroke="#c67139" stroke-width="2"/>

	<!-- Node 1: "Ana" -->
	<g transform="translate(110, 75)">
		<rect x="0" y="0" width="75" height="50" rx="6" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<!-- Data compartment -->
		<rect x="5" y="6" width="38" height="38" rx="4" fill="#ebddc5"/>
		<text x="24" y="29" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">"Ana"</text>
		<!-- Next compartment -->
		<rect x="47" y="6" width="23" height="38" rx="4" fill="#f2f5ea"/>
		<circle cx="58" cy="25" r="3.5" fill="#7a8a5e"/>
	</g>

	<!-- Arrow Node 1 -> Node 2 -->
	<path d="M185 100 L205 100" stroke="#7a8a5e" stroke-width="2"/>

	<!-- Node 2: "Leo" -->
	<g transform="translate(210, 75)">
		<rect x="0" y="0" width="75" height="50" rx="6" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<!-- Data compartment -->
		<rect x="5" y="6" width="38" height="38" rx="4" fill="#ebddc5"/>
		<text x="24" y="29" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#8c491a" text-anchor="middle">"Leo"</text>
		<!-- Next compartment -->
		<rect x="47" y="6" width="23" height="38" rx="4" fill="#f2f5ea"/>
		<circle cx="58" cy="25" r="3.5" fill="#7a8a5e"/>
	</g>

	<!-- Arrow Node 2 -> null ground -->
	<path d="M285 100 L310 100" stroke="#7a8a5e" stroke-width="2"/>

	<!-- Null Ground symbol -->
	<g transform="translate(315, 88)">
		<line x1="0" y1="12" x2="25" y2="12" stroke="#8c491a" stroke-width="2"/>
		<line x1="5" y1="17" x2="20" y2="17" stroke="#8c491a" stroke-width="2"/>
		<line x1="9" y1="22" x2="16" y2="22" stroke="#8c491a" stroke-width="2"/>
		<text x="12" y="32" font-family="'Fira Code', monospace" font-size="6.5" font-weight="700" fill="#8c491a" text-anchor="middle">null</text>
	</g>
</svg>
