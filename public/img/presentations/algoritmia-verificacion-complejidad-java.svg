<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="26" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">Algoritmia: Verificación y Complejidad</text>
	<text x="200" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">Tripleta de Hoare, Invariantes de Bucle &amp; Notación Big-O</text>

	<!-- Hoare tunnel: P -> C -> Q -->
	<g transform="translate(28, 56)">
		<!-- Gate P -->
		<rect x="0" y="8" width="70" height="60" rx="8" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<rect x="0" y="8" width="70" height="18" rx="8" fill="#7a8a5e"/>
		<text x="35" y="21" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#fdfbf7" text-anchor="middle">Precond. P</text>
		<text x="35" y="46" font-family="monospace" font-size="7.5" fill="#2c2a29" text-anchor="middle">n &gt;= 0</text>
		<text x="35" y="60" font-family="monospace" font-size="7" fill="#7a8a5e" text-anchor="middle">✓ abre</text>

		<path d="M 74,38 L 96,38" stroke="#8c491a" stroke-width="2.5" stroke-dasharray="3,3"/>

		<!-- Chamber C -->
		<rect x="100" y="0" width="84" height="76" rx="10" fill="#fdfbf7" stroke="#8c491a" stroke-width="2.5"/>
		<rect x="100" y="0" width="84" height="20" rx="10" fill="#8c491a"/>
		<text x="142" y="14" font-family="'Caprasimo', serif" font-size="8.5" fill="#fdfbf7" text-anchor="middle">Bloque C</text>
		<text x="142" y="40" font-family="monospace" font-size="7.5" fill="#2c2a29" text-anchor="middle">maximo(n)</text>
		<rect x="112" y="48" width="60" height="18" rx="4" fill="#ebddc5"/>
		<text x="142" y="61" font-family="monospace" font-weight="700" font-size="8.5" fill="#8c491a" text-anchor="middle">O(N)</text>

		<path d="M 188,38 L 210,38" stroke="#c67139" stroke-width="2.5" stroke-dasharray="3,3"/>

		<!-- Gate Q -->
		<rect x="214" y="8" width="70" height="60" rx="8" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<rect x="214" y="8" width="70" height="18" rx="8" fill="#c67139"/>
		<text x="249" y="21" font-family="'Figtree', sans-serif" font-weight="700" font-size="8" fill="#fdfbf7" text-anchor="middle">Postcond. Q</text>
		<text x="249" y="46" font-family="monospace" font-size="7.5" fill="#2c2a29" text-anchor="middle">res == max</text>
		<text x="249" y="60" font-family="monospace" font-size="7" fill="#c67139" text-anchor="middle">✓ cierra</text>
	</g>

	<!-- Labels below -->
	<text x="85" y="155" font-family="'Caprasimo', serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">Invariantes de Bucle</text>
	<text x="200" y="155" font-family="'Caprasimo', serif" font-size="8.5" fill="#8c491a" text-anchor="middle">Corrección Total</text>
	<text x="315" y="155" font-family="'Caprasimo', serif" font-size="8.5" fill="#c67139" text-anchor="middle">Big-O: O(1)…O(2^N)</text>
</svg>
