<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>
	<g transform="translate(100, 30)">
		<text x="100" y="-10" font-family="'Caprasimo', serif" font-size="16" fill="#201e1d" text-anchor="middle">Matriz i × j</text>
		<!-- 3x3 Grid -->
		<rect x="0" y="0" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="30" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">1×1=1</text>
		<rect x="68" y="0" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="98" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">1×2=2</text>
		<rect x="136" y="0" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="166" y="25" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">1×3=3</text>

		<rect x="0" y="46" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="30" y="71" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">2×1=2</text>
		<rect x="68" y="46" width="60" height="40" rx="6" fill="#f5ead8" stroke="#c67139" stroke-width="3"/>
		<text x="98" y="71" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#8c491a" text-anchor="middle">2×2=4</text>
		<rect x="136" y="46" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="166" y="71" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">2×3=6</text>

		<rect x="0" y="92" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="30" y="117" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">3×1=3</text>
		<rect x="68" y="92" width="60" height="40" rx="6" fill="#f5ead8" stroke="#d9cbba" stroke-width="2"/>
		<text x="98" y="117" font-family="'Fira Code', monospace" font-size="12" fill="#201e1d" text-anchor="middle">3×2=6</text>
		<rect x="136" y="92" width="60" height="40" rx="6" fill="#f5ead8" stroke="#7a8a5e" stroke-width="3"/>
		<text x="166" y="117" font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#7a8a5e" text-anchor="middle">3×3=9</text>
	</g>
</svg>