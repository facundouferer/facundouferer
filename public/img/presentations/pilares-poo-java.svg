<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="40" y="162" width="320" height="14" rx="7" fill="#dcd3c4"/>

	<!-- Pillar 1: Abstraccion -->
	<rect x="56" y="60" width="62" height="102" rx="26" fill="#f5ead8" stroke="#c67139" stroke-width="4"/>
	<circle cx="87" cy="88" r="14" fill="#c67139"/>
	<text x="87" y="132" font-family="'Caprasimo', serif" font-size="20" fill="#201e1d" text-anchor="middle">A</text>

	<!-- Pillar 2: Encapsulamiento -->
	<rect x="136" y="48" width="62" height="114" rx="26" fill="#f5ead8" stroke="#7a8a5e" stroke-width="4"/>
	<circle cx="167" cy="78" r="14" fill="#7a8a5e"/>
	<text x="167" y="126" font-family="'Caprasimo', serif" font-size="20" fill="#201e1d" text-anchor="middle">E</text>

	<!-- Pillar 3: Herencia -->
	<rect x="216" y="60" width="62" height="102" rx="26" fill="#f5ead8" stroke="#8c491a" stroke-width="4"/>
	<circle cx="247" cy="88" r="14" fill="#8c491a"/>
	<text x="247" y="132" font-family="'Caprasimo', serif" font-size="20" fill="#201e1d" text-anchor="middle">H</text>

	<!-- Pillar 4: Polimorfismo -->
	<rect x="296" y="48" width="62" height="114" rx="26" fill="#f5ead8" stroke="#7a8a5e" stroke-width="4"/>
	<circle cx="327" cy="78" r="14" fill="#7a8a5e"/>
	<text x="327" y="126" font-family="'Caprasimo', serif" font-size="20" fill="#201e1d" text-anchor="middle">P</text>

	<!-- Roof carried by the four pillars -->
	<rect x="40" y="22" width="320" height="16" rx="8" fill="#c67139"/>
	<text x="200" y="14" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">POO</text>
</svg>
