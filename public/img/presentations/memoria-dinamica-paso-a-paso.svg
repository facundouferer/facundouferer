<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Title -->
	<text x="24" y="28" font-family="'Caprasimo', serif" font-size="15" fill="#8c491a">Memoria dinámica</text>
	<text x="24" y="43" font-family="'Figtree', sans-serif" font-size="8.5" fill="#56633f">malloc · calloc · realloc · free</text>

	<!-- Stack -->
	<g transform="translate(24, 58)">
		<rect x="0" y="0" width="104" height="112" rx="14" fill="#fdfbf7" stroke="#dcd3c4" stroke-width="1.8"/>
		<text x="12" y="20" font-family="'Figtree', sans-serif" font-weight="700" font-size="7.5" fill="#56633f">PILA</text>
		<rect x="10" y="30" width="84" height="32" rx="8" fill="#ebddc5"/>
		<text x="18" y="44" font-family="monospace" font-weight="700" font-size="8" fill="#201e1d">numeros</text>
		<text x="18" y="56" font-family="monospace" font-size="8" fill="#56633f">0x2000</text>
		<rect x="10" y="70" width="84" height="32" rx="8" fill="#ebddc5"/>
		<text x="18" y="84" font-family="monospace" font-weight="700" font-size="8" fill="#201e1d">capacidad</text>
		<text x="18" y="96" font-family="monospace" font-size="8" fill="#201e1d">8</text>
	</g>

	<!-- Pointer arrow -->
	<path d="M 118,104 C 150,104 150,132 176,132" fill="none" stroke="#7a8a5e" stroke-width="2.4" stroke-linecap="round"/>
	<polygon points="182,132 175,128 175,136" fill="#7a8a5e"/>

	<!-- Heap: old block freed -->
	<g transform="translate(150, 58)">
		<rect x="0" y="0" width="112" height="44" rx="12" fill="none" stroke="#a89d8f" stroke-width="1.6" stroke-dasharray="4 3"/>
		<text x="10" y="15" font-family="monospace" font-weight="700" font-size="7.5" fill="#8c8275">0x1000 · liberado</text>
		<g font-family="monospace" font-size="8" fill="#8c8275" text-anchor="middle">
			<rect x="8" y="21" width="22" height="16" rx="4" fill="#e8decb"/><text x="19" y="32">5</text>
			<rect x="33" y="21" width="22" height="16" rx="4" fill="#e8decb"/><text x="44" y="32">8</text>
			<rect x="58" y="21" width="22" height="16" rx="4" fill="#e8decb"/><text x="69" y="32">13</text>
			<rect x="83" y="21" width="22" height="16" rx="4" fill="#e8decb"/><text x="94" y="32">2</text>
		</g>
	</g>

	<!-- Copy arrow -->
	<path d="M 268,80 C 300,80 318,92 318,108" fill="none" stroke="#c67139" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/>
	<text x="286" y="74" font-family="monospace" font-size="7.5" font-weight="700" fill="#8c491a">realloc</text>

	<!-- Heap: new block -->
	<g transform="translate(182, 112)">
		<rect x="0" y="0" width="196" height="58" rx="14" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="2"/>
		<text x="10" y="16" font-family="monospace" font-weight="700" font-size="7.5" fill="#56633f">0x2000 · reservado</text>
		<g font-family="monospace" font-size="8" font-weight="700" text-anchor="middle">
			<rect x="8" y="24" width="20" height="24" rx="5" fill="#f0fae1"/><text x="18" y="40" fill="#201e1d">5</text>
			<rect x="31" y="24" width="20" height="24" rx="5" fill="#f0fae1"/><text x="41" y="40" fill="#201e1d">8</text>
			<rect x="54" y="24" width="20" height="24" rx="5" fill="#f0fae1"/><text x="64" y="40" fill="#201e1d">13</text>
			<rect x="77" y="24" width="20" height="24" rx="5" fill="#f0fae1"/><text x="87" y="40" fill="#201e1d">2</text>
			<rect x="100" y="24" width="20" height="24" rx="5" fill="#fff2eb" stroke="#c67139" stroke-width="1.2"/><text x="110" y="40" fill="#8c491a">7</text>
			<rect x="123" y="24" width="20" height="24" rx="5" fill="#e8decb"/><text x="133" y="40" fill="#8c8275">?</text>
			<rect x="146" y="24" width="20" height="24" rx="5" fill="#e8decb"/><text x="156" y="40" fill="#8c8275">?</text>
			<rect x="169" y="24" width="20" height="24" rx="5" fill="#e8decb"/><text x="179" y="40" fill="#8c8275">?</text>
		</g>
	</g>

	<!-- Ground -->
	<rect x="24" y="182" width="354" height="6" rx="3" fill="#dcd3c4"/>
</svg>
