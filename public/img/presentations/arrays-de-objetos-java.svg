<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="25" y="170" width="350" height="10" rx="5" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="30" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a" text-anchor="middle">Arrays de Objetos</text>
	<text x="200" y="44" font-family="'Figtree', sans-serif" font-size="9" fill="#7a8a5e" text-anchor="middle">Doble Nivel de Memoria en el Heap</text>

	<!-- Stack pointer -->
	<g transform="translate(30, 75)">
		<rect x="0" y="0" width="65" height="55" rx="6" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="32" y="18" font-family="'Caprasimo', serif" font-size="8" fill="#7a8a5e" text-anchor="middle">Stack</text>
		<text x="32" y="32" font-family="'Fira Code', monospace" font-size="7" fill="#201e1d" text-anchor="middle">plantel</text>
		<text x="32" y="46" font-family="'Fira Code', monospace" font-size="7" fill="#c67139" text-anchor="middle">0x1000</text>
	</g>

	<!-- Arrow Stack -> Array -->
	<path d="M97 102 L118 102" stroke="#c67139" stroke-width="2" marker-end="url(#arr-orange)"/>

	<!-- Array container in Heap (Level 1) -->
	<g transform="translate(122, 60)">
		<rect x="0" y="0" width="125" height="85" rx="8" fill="#fdfbf7" stroke="#c67139" stroke-width="2"/>
		<text x="62" y="16" font-family="'Caprasimo', serif" font-size="8" fill="#8c491a" text-anchor="middle">Persona[3] @0x1000</text>
		
		<!-- Slot 0 -->
		<rect x="8" y="24" width="109" height="16" rx="3" fill="#ebddc5" stroke="#dcd3c4"/>
		<text x="14" y="35" font-family="'Fira Code', monospace" font-size="7" fill="#8c491a">[0]</text>
		<text x="75" y="35" font-family="'Fira Code', monospace" font-size="7" fill="#201e1d">0x5A00 →</text>

		<!-- Slot 1 -->
		<rect x="8" y="43" width="109" height="16" rx="3" fill="#ebddc5" stroke="#dcd3c4"/>
		<text x="14" y="54" font-family="'Fira Code', monospace" font-size="7" fill="#8c491a">[1]</text>
		<text x="75" y="54" font-family="'Fira Code', monospace" font-size="7" fill="#201e1d">0x5B00 →</text>

		<!-- Slot 2 (null slot) -->
		<rect x="8" y="62" width="109" height="16" rx="3" fill="#f8e7e7" stroke="#d9534f"/>
		<text x="14" y="73" font-family="'Fira Code', monospace" font-size="7" fill="#d9534f">[2]</text>
		<text x="75" y="73" font-family="'Fira Code', monospace" font-weight="700" font-size="7" fill="#d9534f">null ✕</text>
	</g>

	<!-- Arrows from slots to instances -->
	<path d="M250 92 L275 80" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="2 2"/>
	<path d="M250 111 L275 125" stroke="#7a8a5e" stroke-width="1.5" stroke-dasharray="2 2"/>

	<!-- Heap Objects (Level 2) -->
	<g transform="translate(280, 55)">
		<rect x="0" y="0" width="95" height="42" rx="6" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="47" y="14" font-family="'Caprasimo', serif" font-size="7" fill="#7a8a5e" text-anchor="middle">Persona @0x5A00</text>
		<text x="8" y="27" font-family="'Fira Code', monospace" font-size="7" fill="#201e1d">"Messi"</text>
		<text x="8" y="37" font-family="'Fira Code', monospace" font-size="7" fill="#8c491a">num: 10</text>
	</g>

	<g transform="translate(280, 105)">
		<rect x="0" y="0" width="95" height="42" rx="6" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="47" y="14" font-family="'Caprasimo', serif" font-size="7" fill="#7a8a5e" text-anchor="middle">Persona @0x5B00</text>
		<text x="8" y="27" font-family="'Fira Code', monospace" font-size="7" fill="#201e1d">"Di María"</text>
		<text x="8" y="37" font-family="'Fira Code', monospace" font-size="7" fill="#8c491a">num: 11</text>
	</g>
</svg>
