<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="30" y="166" width="340" height="12" rx="6" fill="#dcd3c4"/>

	<!-- Box 1: .java Source -->
	<rect x="40" y="55" width="80" height="96" rx="16" fill="#f5ead8" stroke="#8c491a" stroke-width="3"/>
	<rect x="54" y="70" width="52" height="6" rx="3" fill="#8c491a"/>
	<rect x="54" y="82" width="40" height="5" rx="2.5" fill="#dcd3c4"/>
	<rect x="54" y="93" width="46" height="5" rx="2.5" fill="#dcd3c4"/>
	<text x="80" y="130" font-family="'Caprasimo', serif" font-size="14" fill="#8c491a" text-anchor="middle">.java</text>

	<!-- Arrow 1: javac -->
	<path d="M130 100 H160" stroke="#c67139" stroke-width="3" stroke-linecap="round"/>
	<polygon points="160,94 170,100 160,106" fill="#c67139"/>
	<text x="148" y="90" font-family="'Figtree', sans-serif" font-size="11" font-weight="700" fill="#c67139" text-anchor="middle">javac</text>

	<!-- Box 2: Bytecode .class -->
	<rect x="180" y="55" width="80" height="96" rx="16" fill="#f5ead8" stroke="#c67139" stroke-width="3"/>
	<circle cx="205" cy="76" r="6" fill="#c67139"/>
	<circle cx="225" cy="76" r="6" fill="#7a8a5e"/>
	<circle cx="235" cy="94" r="6" fill="#c67139"/>
	<circle cx="210" cy="94" r="6" fill="#8c491a"/>
	<text x="220" y="130" font-family="'Caprasimo', serif" font-size="13" fill="#c67139" text-anchor="middle">.class</text>

	<!-- Arrow 2: JVM -->
	<path d="M270 100 H300" stroke="#7a8a5e" stroke-width="3" stroke-linecap="round"/>
	<polygon points="300,94 310,100 300,106" fill="#7a8a5e"/>

	<!-- Box 3: JVM Engine -->
	<rect x="320" y="45" width="60" height="116" rx="20" fill="#7a8a5e" stroke="#201e1d" stroke-width="2"/>
	<rect x="330" y="60" width="40" height="8" rx="4" fill="#f5ead8"/>
	<rect x="330" y="74" width="40" height="8" rx="4" fill="#f5ead8"/>
	<rect x="330" y="88" width="40" height="8" rx="4" fill="#f5ead8"/>
	<text x="350" y="132" font-family="'Caprasimo', serif" font-size="13" fill="#f5ead8" text-anchor="middle">JVM</text>

	<!-- Header Banner -->
	<text x="200" y="32" font-family="'Caprasimo', serif" font-size="15" fill="#8c491a" text-anchor="middle">Write Once, Run Anywhere</text>
</svg>
