<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="100%" height="100%">
	<rect width="400" height="200" fill="#ebddc5"/>

	<!-- Ground -->
	<rect x="20" y="175" width="360" height="8" rx="4" fill="#dcd3c4"/>

	<!-- Title -->
	<text x="200" y="26" font-family="'Caprasimo', serif" font-size="13" fill="#8c491a" text-anchor="middle">Iteradores &amp; Contrato equals/hashCode</text>
	<text x="200" y="40" font-family="'Figtree', sans-serif" font-size="8.5" fill="#7a8a5e" text-anchor="middle">ConcurrentModificationException &amp; Ordenamiento</text>

	<!-- Left: Iterator with cursor and modCount meters -->
	<g transform="translate(35, 55)">
		<rect x="0" y="0" width="140" height="95" rx="5" fill="#fdfbf7" stroke="#7a8a5e" stroke-width="1.5"/>
		<text x="70" y="16" font-family="'Caprasimo', serif" font-size="8.5" fill="#8c491a" text-anchor="middle">Iterator &amp; modCount</text>

		<!-- Array Cells -->
		<g transform="translate(10, 26)">
			<rect x="0" y="0" width="28" height="24" rx="3" fill="#ebddc5" stroke="#7a8a5e" stroke-width="1"/>
			<text x="14" y="16" font-family="'Fira Code', monospace" font-size="8" fill="#2c2a29" text-anchor="middle">"A"</text>

			<rect x="32" y="0" width="28" height="24" rx="3" fill="#f2f5ea" stroke="#c67139" stroke-width="1.5"/>
			<text x="46" y="16" font-family="'Fira Code', monospace" font-size="8" fill="#8c491a" font-weight="700" text-anchor="middle">"B"</text>

			<rect x="64" y="0" width="28" height="24" rx="3" fill="#ebddc5" stroke="#7a8a5e" stroke-width="1"/>
			<text x="78" y="16" font-family="'Fira Code', monospace" font-size="8" fill="#2c2a29" text-anchor="middle">"C"</text>

			<rect x="96" y="0" width="24" height="24" rx="3" fill="#ebddc5" stroke="#7a8a5e" stroke-width="1"/>
			<text x="108" y="16" font-family="'Fira Code', monospace" font-size="8" fill="#2c2a29" text-anchor="middle">"D"</text>

			<!-- Cursor arrow -->
			<path d="M 46 36 L 46 26" stroke="#c67139" stroke-width="2"/>
			<polygon points="46,26 42,32 50,32" fill="#c67139"/>
			<text x="46" y="46" font-family="'Figtree', sans-serif" font-size="7" font-weight="700" fill="#c67139" text-anchor="middle">cursor</text>
		</g>

		<!-- Counter match badge -->
		<g transform="translate(10, 70)">
			<rect x="0" y="0" width="120" height="18" rx="3" fill="#ebddc5"/>
			<text x="60" y="12" font-family="'Fira Code', monospace" font-size="7.5" fill="#8c491a" text-anchor="middle">modCount == expected</text>
		</g>
	</g>

	<!-- Vertical Divider -->
	<line x1="195" y1="55" x2="195" y2="160" stroke="#dcd3c4" stroke-width="1.5" stroke-dasharray="3 3"/>

	<!-- Right: equals & hashCode contract scale / check -->
	<g transform="translate(215, 55)">
		<rect x="0" y="0" width="150" height="95" rx="5" fill="#fdfbf7" stroke="#c67139" stroke-width="1.5"/>
		<text x="75" y="16" font-family="'Caprasimo', serif" font-size="8.5" fill="#8c491a" text-anchor="middle">Contrato de Oro</text>

		<!-- Balance beam -->
		<g transform="translate(20, 30)">
			<line x1="20" y1="20" x2="90" y2="20" stroke="#7a8a5e" stroke-width="2"/>
			<polygon points="55,20 50,32 60,32" fill="#8c491a"/>

			<!-- Pan Left: a.equals(b) == true -->
			<circle cx="20" cy="20" r="14" fill="#ebddc5" stroke="#7a8a5e" stroke-width="1"/>
			<text x="20" y="23" font-family="'Figtree', sans-serif" font-size="7.5" font-weight="700" fill="#8c491a" text-anchor="middle">equals</text>

			<!-- Pan Right: a.hashCode() == b.hashCode() -->
			<circle cx="90" cy="20" r="14" fill="#f2f5ea" stroke="#c67139" stroke-width="1.5"/>
			<text x="90" y="23" font-family="'Fira Code', monospace" font-size="7" font-weight="700" fill="#c67139" text-anchor="middle">hash</text>
		</g>

		<!-- Formula banner -->
		<g transform="translate(12, 70)">
			<rect x="0" y="0" width="126" height="18" rx="3" fill="#f2f5ea" stroke="#7a8a5e" stroke-width="1"/>
			<text x="63" y="12" font-family="'Figtree', sans-serif" font-size="7.5" font-weight="700" fill="#7a8a5e" text-anchor="middle">a.equals(b) ⇒ a.hash == b.hash</text>
		</g>
	</g>
</svg>
