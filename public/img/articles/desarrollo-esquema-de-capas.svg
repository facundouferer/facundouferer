<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Esquema de cuatro capas para desarrollo con agentes de IA">
  <defs>
    <marker id="heroDown" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8c491a"/>
    </marker>
    <marker id="heroUp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#56633f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#f5ead8"/>

  <text x="72" y="86" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#8c491a" letter-spacing="1.5">DESARROLLO CON AGENTES DE IA</text>
  <text x="72" y="146" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#201e1d">Un esquema de cuatro capas</text>

  <!-- Layer 1 -->
  <rect x="72" y="196" width="800" height="88" rx="22" fill="#ffe1d0" stroke="#c67139" stroke-width="3"/>
  <circle cx="126" cy="240" r="26" fill="#c67139"/>
  <text x="126" y="249" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#f9f4ed">1</text>
  <text x="172" y="234" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#8c491a">Intención</text>
  <text x="172" y="262" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="17" fill="#474238">el contrato · vive en el repo · dueño humano</text>
  <text x="900" y="234" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c491a">AUTORIDAD</text>
  <text x="900" y="258" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#8c491a">MÁXIMA</text>

  <line x1="126" y1="288" x2="126" y2="308" stroke="#8c491a" stroke-width="3" marker-end="url(#heroDown)"/>

  <!-- Layer 2 -->
  <rect x="72" y="314" width="800" height="88" rx="22" fill="#eee7db" stroke="#a19786" stroke-width="2"/>
  <circle cx="126" cy="358" r="26" fill="#82796a"/>
  <text x="126" y="367" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#f9f4ed">2</text>
  <text x="172" y="352" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#474238">Coordinación</text>
  <text x="172" y="380" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="17" fill="#474238">quién hace qué · fuera del repo · referencia, no copia</text>
  <text x="900" y="365" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" fill="#645c50">vive un sprint</text>

  <line x1="126" y1="406" x2="126" y2="426" stroke="#8c491a" stroke-width="3" marker-end="url(#heroDown)"/>

  <!-- Layer 3 -->
  <rect x="72" y="432" width="800" height="88" rx="22" fill="#eee7db" stroke="#a19786" stroke-width="2" stroke-dasharray="9 7"/>
  <circle cx="126" cy="476" r="26" fill="#82796a"/>
  <text x="126" y="485" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#f9f4ed">3</text>
  <text x="172" y="470" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#474238">Ejecución</text>
  <text x="172" y="498" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="17" fill="#474238">el agente escribe el diff · desechable · no adivina</text>
  <text x="900" y="483" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" fill="#645c50">vive una sesión</text>

  <line x1="126" y1="524" x2="126" y2="544" stroke="#8c491a" stroke-width="3" marker-end="url(#heroDown)"/>

  <!-- Layer 4 -->
  <rect x="72" y="550" width="800" height="88" rx="22" fill="#e1eecc" stroke="#728157" stroke-width="3"/>
  <circle cx="126" cy="588" r="26" fill="#56633f"/>
  <text x="126" y="597" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="middle" fill="#f0fae1">4</text>
  <text x="172" y="582" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#3d472b">Verificación</text>
  <text x="172" y="610" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="17" fill="#474238">la evidencia · gates bloqueantes · no se discute</text>
  <text x="900" y="590" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#3d472b">PODER DE VETO</text>

  <!-- Feedback arrow: verification corrects layer 1 -->
  <path d="M1064 588 L1128 588 L1128 240 L1080 240" fill="none" stroke="#728157" stroke-width="3" marker-end="url(#heroUp)"/>
  <text x="1146" y="410" font-family="Figtree, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#56633f" transform="rotate(-90 1146 410)" text-anchor="middle">si la evidencia contradice, gana la evidencia</text>
</svg>
